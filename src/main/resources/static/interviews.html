<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>면접 관리 - EDGE</title>
  <style>
    :root { --bg:#0f172a; --panel:#111827; --text:#e5e7eb; --muted:#9ca3af; --accent:#22c55e; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: #0b1023; color: var(--text); }
    header { padding:14px 18px; }
    a { color: var(--text); text-decoration:none; }
    .container { padding:18px; display:flex; justify-content:center; }
    .main { width:100%; max-width:1600px; display:flex; flex-direction:column; gap:14px; }
    .content { display:grid; grid-template-columns: 1fr 340px; gap:14px; align-items:start; }
    .panel { background: rgba(17,24,39,0.9); border:1px solid rgba(255,255,255,0.06); border-radius:10px; padding:14px; }
    .row { display:flex; gap:10px; align-items:center; }
    .muted { color: var(--muted); }
    input[type=text] { width:100%; background:#0f172a; border:1px solid rgba(255,255,255,0.12); border-radius:8px; padding:10px 12px; color:var(--text); }
    textarea { width:100%; min-height:80px; background:#0f172a; border:1px solid rgba(255,255,255,0.12); border-radius:8px; padding:10px 12px; color:var(--text); resize:none; overflow:hidden; }
    button { background: transparent; color: var(--text); border:1px solid rgba(255,255,255,0.2); padding:8px 10px; border-radius:8px; cursor:pointer; }
    button.primary { border-color: rgba(34,197,94,0.6); background: rgba(34,197,94,0.12); }
    .list { display:flex; flex-direction:column; gap:8px; max-height: calc(100vh - 200px); overflow:auto; }
    .item { padding:10px; border:1px solid rgba(255,255,255,0.08); border-radius:8px; cursor:pointer; }
    .item.active { border-color: rgba(34,197,94,0.6); background: rgba(34,197,94,0.08); }
    .grid2 { display:grid; grid-template-columns: 1fr 1fr; gap:10px; }
    /* Scores UI */
    .score-card { border:1px solid rgba(255,255,255,0.12); border-radius:10px; padding:10px; }
    .score-title { font-weight:600; }
    .score-note { font-size:12px; color: var(--muted); margin-top:2px; }
    .score-controls { display:grid; grid-template-columns: repeat(10, 36px); gap:6px; margin-top:8px; }
    .score-controls input { display:none; }
    .score-controls label { width:36px; height:36px; display:flex; align-items:center; justify-content:center; border:1px solid rgba(255,255,255,0.15); border-radius:8px; cursor:pointer; }
    .score-controls label.selected { background: rgba(34,197,94,0.15); border-color: rgba(34,197,94,0.6); }
    .pill { padding:6px 10px; border:1px solid rgba(255,255,255,0.2); border-radius:999px; font-size:12px; }
    .right { display:flex; flex-direction:column; gap:10px; }
    .score-btns button { width:28px; height:28px; font-size:12px; }
    .settings .row { justify-content: space-between; }
    /* Modal */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.55); display: none; align-items: center; justify-content: center; z-index: 50; }
    .modal { width: min(900px, 92vw); background: rgba(17,24,39,0.98); border:1px solid rgba(255,255,255,0.08); border-radius:12px; padding:16px; }
    /* Settings modal: 높이 제한 + 스크롤 */
    #settingsOverlay .modal { max-height: 80vh; overflow: auto; }
    .modal h2 { margin:0 0 10px; font-size:18px; }
    .modal .row { align-items: center; }
    .list-col { display:flex; flex-direction:column; gap:10px; }
    .q-row, .area-row { display:grid; grid-template-columns: 1fr auto; gap:10px; }
    .area-row { grid-template-columns: 1fr 1fr auto; }
    .ghost { opacity: .6; }
    .toolbar { display:flex; gap:8px; justify-content:flex-end; margin-top:12px; }
    /* Settings questions visuals */
    .q-block { background:#0f172a; border:1px solid rgba(255,255,255,0.12); border-radius:10px; padding:10px; }
    .q-label { font-size:12px; color:var(--muted); margin:0 0 6px 2px; }
    .sub-title { font-size:12px; color:var(--muted); margin:8px 0 4px 2px; }
    .sub-list { margin:0 0 10px 0; padding-left:10px; border-left:2px solid rgba(255,255,255,0.12); display:flex; flex-direction:column; gap:10px; }
    /* Application QA cards */
    .qa-card { border:1px solid rgba(255,255,255,0.12); border-radius:10px; padding:10px; }
    .qa-q { font-weight:600; margin-bottom:6px; }
    .qa-a { white-space:pre-wrap; }
    /* Center split */
    .center { display:grid; grid-template-columns: minmax(700px, 1.5fr) minmax(420px, 1fr); gap:14px; }
    .section { background:#0f172a; border:1px solid rgba(255,255,255,0.08); border-radius:10px; padding:12px; min-height:360px; }
    .section.info { min-height:320px; min-width:700px; max-width:1200px; }
    .section.qa { min-height:420px; min-width:480px; max-width:900px; }
    /* File picker */
    .picker { display:grid; grid-template-columns: 260px 1fr; gap:12px; height:70vh; }
    .picker .tree, .picker .content { background:#0f172a; border:1px solid rgba(255,255,255,0.08); border-radius:10px; padding:10px; overflow:auto; }
    .tree-item { cursor:pointer; padding:6px 8px; border-radius:6px; }
    .tree-item:hover { background: rgba(255,255,255,0.06); }
    .row-between { display:flex; align-items:center; justify-content:space-between; }
    .badge { padding:4px 8px; border:1px solid rgba(255,255,255,0.2); border-radius:999px; font-size:12px; }
  </style>
</head>
<body>
  <header>
    <a href="/">← 대시보드</a>
  </header>
  <div class="container">
    <div class="main">
      <div class="content">
        <!-- 중앙 본문 -->
        <div class="panel" id="detail">
          <div class="center">
            <div class="section info">
              <div class="muted" style="font-size:12px;">지원자 정보</div>
              <div id="applicantInfo" class="grid2" style="margin:8px 0 12px;"></div>
              <div class="muted" style="font-size:12px;">지원서 질문/답변</div>
              <div id="applicationQA" style="display:grid; gap:8px; margin-top:8px;"></div>
            </div>
            <div class="section qa">
              <div class="muted" style="font-size:12px;">면접 질문/답변</div>
              <div id="qaContainer" style="display:grid; gap:10px; margin-top:8px;"></div>
              <div style="margin-top:12px;">
                <div class="muted" style="font-size:12px;">면접관 코멘트</div>
                <textarea id="interviewerComment" placeholder="총평/메모"></textarea>
              </div>
              <div style="margin-top:12px;">
                <div class="muted" style="font-size:12px;">점수</div>
                <div id="scores"></div>
              </div>
            </div>
          </div>
        </div>

        <!-- 오른쪽 사이드바 -->
        <div class="right">
          <div class="panel">
            <div class="muted" style="font-size:12px; margin-bottom:6px;">면접관 이름</div>
            <input id="interviewer" type="text" placeholder="예: 김운영" />
          </div>
          <div class="panel">
            <div class="row" style="gap:8px;">
              <button id="load-applicants-btn" onclick="openPickerPopup()" class="primary">파일 선택</button>
              <button onclick="openSettings()">설정</button>
            </div>
            <div id="sheetPicker" style="margin-top:10px; display:none;">
              <div class="muted" style="font-size:12px; margin-bottom:6px;">시트 탭</div>
              <select id="sheetSelect" style="width:100%; background:#0f172a; border:1px solid rgba(255,255,255,0.12); border-radius:8px; padding:8px 10px; color:#e5e7eb;"></select>
            </div>
          </div>
          <div class="panel">
            <div class="muted" style="font-size:12px; margin-bottom:6px;">지원자 목록</div>
            <div id="applicants" class="list"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let __drivePickerWin = null;
    const state = {
      isLoadingApplicants: false, // 지원자 목록 로딩 상태
      isLoadingSettings: false, // 설정 불러오기 상태
      isSavingSettings: false,  // 설정 저장 상태
      // 질문 구조: [{ title: '큰 질문', sub: ['소1','소2', ...] }]
      questions: Array.from({length: 6}, (_,i)=>({ title:`질문 ${i+1}` , sub:[] })),
      scoreAreas: ['커뮤니케이션','문제해결','팀워크'],
      scoreAreaNotes: ['','',''],
      selectedApplicant: null,
      selectedList: [],
      sheet: { rows: [] },
      applicantsRenderLock: false
    };
    // 기존 드라이브 선택/불러오기는 파일 선택 모달로 통합됨

    function qs(sel){ return document.querySelector(sel); }
    function el(tag, attrs={}, ...children){ const e=document.createElement(tag); Object.entries(attrs).forEach(([k,v])=> e.setAttribute(k,v)); children.forEach(c=> e.append(c)); return e; }

    function applySettingsFromModal(){
      state.applicantsRenderLock = true;
      // 질문 수집
      const questions = Array.from(document.querySelectorAll('#modalQuestions .q-input'))
              .map(input => (input.value || '').trim())
              .filter(Boolean)
              .map(title => ({ title: title, sub: [] }));
      if (!questions.length) questions.push({ title:'질문 1', sub:[] });
      state.questions = questions;

      // 점수 영역 수집
      const scoreAreas = Array.from(document.querySelectorAll('#modalAreas .area-name'))
              .map(input => input.value.trim())
              .filter(Boolean);
      if (!scoreAreas.length) scoreAreas.push('종합');
      state.scoreAreas = scoreAreas;
      // 참고: scoreAreaNotes는 단순화를 위해 이번 버전에서는 제외합니다.
      state.scoreAreaNotes = Array(state.scoreAreas.length).fill('');

      closeSettings();
      renderQA();
      renderScores();
    }

    function renderApplicants(){
      if (state.applicantsRenderLock) return;
      const box = qs('#applicants');
      box.innerHTML = '';
      state.sheet.rows.slice(1).forEach((row, idx)=>{
        const name = row[1] || '(이름 없음)';
        const div = el('div', { class:'item' + (state.selectedApplicant===idx?' active':'') });
        div.textContent = name;
        div.addEventListener('click', ()=>{ state.selectedApplicant = idx; renderDetail(); });
        box.appendChild(div);
      });
    }

    function renderDetail(){
      const idx = state.selectedApplicant;
      const infoBox = qs('#applicantInfo');
      const appQA = qs('#applicationQA');
      if (idx == null) { infoBox.innerHTML=''; if (appQA) appQA.innerHTML=''; qs('#qaContainer').innerHTML=''; qs('#scores').innerHTML=''; return; }
      const row = state.sheet.rows[idx+1] || [];

      // '이름' 정보만 고정적으로 표시합니다.
      infoBox.innerHTML = '';
      infoBox.appendChild(el('div',{}, el('div',{class:'muted'},'이름'), el('div',{}, row[1]||'')));

      // 지원서 질문/답변은 C열(인덱스 2)부터 시작하도록 변경합니다.
      if (appQA) {
        appQA.innerHTML = '';
        const header = state.sheet.rows[0] || [];
        // 시작 인덱스를 4에서 2로 변경
        for (let i=2; i<header.length; i++){
          const q = header[i];
          if (!q) continue;
          const a = row[i] || '';
          const card = el('div', { class:'qa-card' });
          card.appendChild(el('div', { class:'qa-q' }, q));
          card.appendChild(el('div', { class:'qa-a' }, a));
          appQA.appendChild(card);
        }
      }
      // 면접 질문/답변은 지원자 선택 시 업데이트하지 않음
    }

    function renderQA(){
      const box = qs('#qaContainer');
      box.innerHTML = '';
      const idx = state.selectedApplicant;
      const row = idx==null ? [] : (state.sheet.rows[idx+1]||[]);
      state.questions.forEach((qObj)=>{
        const block = document.createElement('div');
        const title = document.createElement('div');
        title.className = 'muted';
        title.style.marginBottom = '6px';
        title.textContent = qObj.title;
        block.appendChild(title);
        if (qObj.sub && qObj.sub.length){
          qObj.sub.forEach(subText=>{
            const subWrap = document.createElement('div');
            subWrap.style.marginBottom = '6px';
            const subLabel = document.createElement('div');
            subLabel.className = 'muted';
            subLabel.style.fontSize = '12px';
            subLabel.textContent = `- ${subText}`;
            const ta = el('textarea', { placeholder:'답변 입력' });
            const autoResize = () => { ta.style.height = 'auto'; ta.style.height = (ta.scrollHeight + 2) + 'px'; };
            ta.addEventListener('input', autoResize);
            setTimeout(autoResize, 0);
            subWrap.appendChild(subLabel);
            subWrap.appendChild(ta);
            block.appendChild(subWrap);
          });
        } else {
          const ta = el('textarea', { placeholder:'답변 입력' });
          const autoResize = () => { ta.style.height = 'auto'; ta.style.height = (ta.scrollHeight + 2) + 'px'; };
          ta.addEventListener('input', autoResize);
          setTimeout(autoResize, 0);
          block.appendChild(ta);
        }
        box.appendChild(block);
      });
    }

    function renderScores(){
      const box = qs('#scores');
      box.innerHTML = '';
      state.scoreAreas.forEach((area,idx)=>{
        const card = el('div', { class:'score-card' });
        const title = el('div', { class:'score-title' }, area);
        card.append(title);
        if (state.scoreAreaNotes && state.scoreAreaNotes[idx]) {
          card.append(el('div', { class:'score-note' }, state.scoreAreaNotes[idx]));
        }
        const group = `score_${idx}`;
        const controls = el('div', { class:'score-controls' });
        for (let i=1;i<=10;i++){
          const label = el('label', {});
          const r = document.createElement('input');
          r.type = 'radio'; r.name = group; r.value = String(i);
          r.onchange = ()=>{
            Array.from(controls.querySelectorAll('label')).forEach(l=> l.classList.remove('selected'));
            label.classList.add('selected');
          };
          label.appendChild(r);
          const txt = document.createElement('span'); txt.textContent = String(i); label.appendChild(txt);
          controls.appendChild(label);
        }
        card.append(controls);
        box.appendChild(card);
      });
    }

    function addSelected(){
      if (state.selectedApplicant==null) return;
      const exists = state.selectedList.includes(state.selectedApplicant);
      if (!exists) state.selectedList.push(state.selectedApplicant);
      renderSelectedList();
    }

    function removeFromSelected(i){
      state.selectedList = state.selectedList.filter(x=>x!==i);
      renderSelectedList();
    }

    function renderSelectedList(){
      // 우측 목록 아래에 선택된 지원자 뱃지 렌더
      const box = qs('#applicants');
      const sep = el('div', { class:'muted', style:'margin-top:8px;' }, '선택된 지원자');
      box.appendChild(sep);
      state.selectedList.forEach(i=>{
        const row = state.sheet.rows[i+1]||[];
        const name = row[1]||'';
        const badge = el('div', { class:'row', style:'justify-content:space-between; border:1px solid rgba(255,255,255,0.12); border-radius:8px; padding:6px 8px; margin-top:6px;' },
          el('div',{}, name),
          el('button', { onclick:`removeFromSelected(${i})` }, '삭제')
        );
        box.appendChild(badge);
      });
    }

    async function loadApplicantsBy(fileId, range){
      if (state.isLoadingApplicants) return;
      state.isLoadingApplicants = true;
      const btn = qs('#load-applicants-btn');
      if(btn) btn.disabled = true;

      try {
        let metaTitles = [];
        try {
          const metaRes = await fetch(`/api/interviews/applicants/meta?spreadsheetId=${encodeURIComponent(fileId)}`);
          if (metaRes.ok){
            const meta = await metaRes.json();
            metaTitles = (meta.sheets||[]).map(s=> s.properties && s.properties.title).filter(Boolean);
            const picker = qs('#sheetPicker');
            const select = qs('#sheetSelect');
            if (metaTitles.length){
              picker.style.display = 'block';
              select.innerHTML = '';
              metaTitles.forEach(t=>{ const opt=document.createElement('option'); opt.value=t; opt.textContent=t; select.appendChild(opt); });
              if (!select._bound) {
                select.addEventListener('change', async ()=>{
                  const t = select.value;
                  const esc = t ? `'${t.replaceAll("'","''")}'!A1:Z999` : 'A1:Z999';
                  await loadApplicantsBy(fileId, esc);
                });
                select._bound = true;
              }
            }
          }
        } catch(e){ console.error('Sheet meta fetch failed:', e); }

        let effectiveRange = range;
        if (!effectiveRange){
          const select = qs('#sheetSelect');
          const title = (select && select.value) ? select.value : (metaTitles[0] || '');
          effectiveRange = title ? `'${title.replaceAll("'","''")}'!A1:Z999` : 'A1:Z999';
        }

        const url = `/api/interviews/applicants?spreadsheetId=${encodeURIComponent(fileId)}&range=${encodeURIComponent(effectiveRange)}`;
        const res = await fetch(url);
        if (!res.ok) throw new Error(await res.text());
        const json = await res.json();
        state.sheet.rows = json.values || [];
        state.selectedApplicant = null;
        state.applicantsRenderLock = false;
        renderApplicants();
        qs('#applicants').scrollTop = 0;
      } catch (e) {
        alert('지원자 목록을 불러오는 데 실패했습니다: ' + e.message);
      } finally {
        state.isLoadingApplicants = false;
        if(btn) btn.disabled = false;
      }
    }

    // Settings Modal
    function openSettings(){
      state.applicantsRenderLock = true;
      const overlay = qs('#settingsOverlay');
      const qBox = qs('#modalQuestions');
      const aBox = qs('#modalAreas');

      qBox.innerHTML = '';
      (state.questions||[]).forEach((q)=> addQuestionRow(q.title));

      aBox.innerHTML = '';
      (state.scoreAreas||[]).forEach((area)=> addAreaRow(area));

      overlay.style.display = 'flex';
    }
    function closeSettings(){ qs('#settingsOverlay').style.display = 'none'; state.applicantsRenderLock = false; }

    function addQuestionRow(text='') {
      const qBox = qs('#modalQuestions');
      const wrap = el('div', { class:'q-row' });
      const input = el('input', { class:'q-input', type:'text', value: text, placeholder:'질문 텍스트', style:'width:100%; background:#0f172a; border:1px solid rgba(255,255,255,0.12); border-radius:8px; padding:8px 10px; color:#e5e7eb;' });
      const del = el('button', {}, '삭제');
      del.addEventListener('click', ()=> wrap.remove());
      wrap.append(input, del);
      qBox.appendChild(wrap);
    }
    function addSubRow(parent, text=''){
      const row = document.createElement('div');
      row.className = 'q-row';
      const input = el('input', { class:'sub-input', type:'text', value: text, placeholder:'소질문 텍스트', style:'width:100%; background:#0f172a; border:1px solid rgba(255,255,255,0.12); border-radius:8px; padding:8px 10px; color:#e5e7eb;' });
      const del = el('button', {}, '삭제');
      del.addEventListener('click', ()=> row.remove());
      row.append(input, del);
      parent.appendChild(row);
    }
    function addAreaRow(name=''){
      const aBox = qs('#modalAreas');
      const wrap = el('div', { class:'q-row' }); // q-row 스타일 재사용
      const nameInput = el('input', { class:'area-name', type:'text', value: name, placeholder:'영역명', style:'width:100%; background:#0f172a; border:1px solid rgba(255,255,255,0.12); border-radius:8px; padding:8px 10px; color:#e5e7eb;' });
      const del = el('button', { onclick:'this.parentElement.remove()' }, '삭제');
      wrap.append(nameInput, del);
      aBox.appendChild(wrap);
    }


    // 초기 렌더
    renderQA();
    renderScores();

    function openPickerPopup(){
      if (__drivePickerWin && !__drivePickerWin.closed) { __drivePickerWin.focus(); return; }
      __drivePickerWin = window.open('/drive-picker.html', 'edge-drive-picker', 'width=980,height=720');
      const handler = async (ev)=>{
        if (!ev.data || ev.data.type !== 'picker_selected') return;
        try { await loadApplicantsBy(ev.data.fileId, ev.data.range); }
        catch(e){ alert(e.message); }
        window.removeEventListener('message', handler);
      };
      window.addEventListener('message', handler);
    }

    function openPickerWithPurpose(purpose){
      if (__drivePickerWin && !__drivePickerWin.closed) { __drivePickerWin.focus(); return; }
      __drivePickerWin = window.open('/drive-picker.html', 'edge-drive-picker', 'width=980,height=720');
      const handler = (ev)=>{
        if (!ev.data || ev.data.type !== 'picker_selected') return;
        if (purpose === 'settings') {
          qs('#settingsFileId').value = ev.data.fileId;
        } else if (purpose === 'results') {
          qs('#resultFileId').value = ev.data.fileId;
        }
        window.removeEventListener('message', handler);
      };
      window.addEventListener('message', handler);
    }

    async function loadSettingsFromSheet(){
      if (state.isLoadingSettings) return;
      state.isLoadingSettings = true;
      const btn = qs('#load-settings-btn');
      if(btn) {
        btn.disabled = true;
        btn.textContent = '불러오는 중...';
      }

      try {
        const fileId = qs('#settingsFileId').value.trim();
        if (!fileId) { alert('세팅 파일을 먼저 선택하세요'); return; }
        const metaRes = await fetch(`/api/interviews/applicants/meta?spreadsheetId=${encodeURIComponent(fileId)}`);
        const meta = await metaRes.json();
        const title = (meta.sheets && meta.sheets[0] && meta.sheets[0].properties && meta.sheets[0].properties.title) || '';
        const range = title ? `'${title.replaceAll("'","''")}'!1:2` : '1:2';
        const res = await fetch(`/api/interviews/applicants?spreadsheetId=${encodeURIComponent(fileId)}&range=${encodeURIComponent(range)}`);
        if (!res.ok) throw new Error(await res.text());
        const json = await res.json();
        const rows = json.values || [];

        const questionRow = rows[0] || [];
        const scoreAreaRow = rows[1] || [];

        const questions = questionRow.map(title => ({ title: title.trim(), sub: [] })).filter(q => q.title);
        const scoreAreas = scoreAreaRow.map(area => area.trim()).filter(Boolean);

        if (questions.length) state.questions = questions;
        if (scoreAreas.length) state.scoreAreas = scoreAreas;

        renderQA();
        renderScores();
        const qBox = qs('#modalQuestions');
        const aBox = qs('#modalAreas');
        qBox.innerHTML = '';
        aBox.innerHTML = '';
        state.questions.forEach(q => addQuestionRow(q.title));
        state.scoreAreas.forEach(area => addAreaRow(area));

        alert('세팅을 불러왔습니다.');
      } catch(e) {
        alert('세팅 불러오기에 실패했습니다: ' + e.message);
      } finally {
        state.isLoadingSettings = false;
        if(btn) {
          btn.disabled = false;
          btn.textContent = '불러오기';
        }
        state.applicantsRenderLock = false;
      }
    }

    async function saveSettingsToSheet() {
      applySettingsFromModal();

      if (state.isSavingSettings) return;
      state.isSavingSettings = true;
      const btn = qs('#save-settings-btn');
      if (btn) {
        btn.disabled = true;
        btn.textContent = '저장 중...';
      }

      try {
        const fileId = qs('#settingsFileId').value.trim();
        if (!fileId) {
          alert('세팅 파일을 먼저 선택하세요');
          return;
        }
        const metaRes = await fetch(`/api/interviews/applicants/meta?spreadsheetId=${encodeURIComponent(fileId)}`);
        const meta = await metaRes.json();
        const sheetTitle = (meta.sheets && meta.sheets[0] && meta.sheets[0].properties && meta.sheets[0].properties.title) || '';

        const questionTitles = state.questions.map(q => q.title);
        const scoreAreaNames = state.scoreAreas;
        const values = [questionTitles, scoreAreaNames];

        const range = sheetTitle ? `'${sheetTitle.replaceAll("'", "''")}'!1:2` : '1:2';
        await fetch(`/api/interviews/applicants/clear?spreadsheetId=${encodeURIComponent(fileId)}&range=${encodeURIComponent(range)}`, {
          method: 'POST'
        });

        const resp = await fetch(`/api/interviews/applicants/update?spreadsheetId=${encodeURIComponent(fileId)}&range=${encodeURIComponent(range)}&valueInputOption=USER_ENTERED`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            "values": values
          })
        });

        if (resp.ok) {
          alert(`세팅 파일 저장 완료`);
        } else {
          const t = await resp.text();
          throw new Error(t);
        }
      } catch (e) {
        alert('세팅 저장에 실패했습니다: ' + e.message);
      } finally {
        state.isSavingSettings = false;
        if (btn) {
          btn.disabled = false;
          btn.textContent = '저장';
        }
      }
    }

    window.addEventListener('beforeunload', ()=>{
      try { if (__drivePickerWin && !__drivePickerWin.closed) __drivePickerWin.close(); } catch(e){}
    });
  </script>
  <!-- Settings Modal -->
  <div id="settingsOverlay" class="modal-overlay">
    <div class="modal">
      <h2>설정</h2>
      <div class="muted" style="font-size:12px; margin-bottom:8px;">면접 질문(1행)과 점수 영역(2행)을 편집하세요.</div>
      <div class="row" style="gap:16px; align-items:flex-start;">
        <div style="flex:1">
          <div class="row" style="justify-content:space-between; margin-bottom:6px;">
            <div style="font-weight:600;">질문 목록 (1행)</div>
            <button class="primary" onclick="addQuestionRow('')">+ 질문 추가</button>
          </div>
          <div id="modalQuestions" class="list-col"></div>
        </div>
        <div style="flex:1">
          <div class="row" style="justify-content:space-between; margin-bottom:6px;">
            <div style="font-weight:600;">점수 영역 (2행)</div>
            <button class="primary" onclick="addAreaRow('')">+ 영역 추가</button>
          </div>
          <div id="modalAreas" class="list-col"></div>
        </div>
      </div>

      <hr style="border-color: rgba(255,255,255,0.08); margin:12px 0;" />

      <div class="row" style="gap:12px; align-items:flex-end; flex-wrap:wrap;">
        <div style="min-width:260px;">
          <div class="muted" style="font-size:12px;">세팅 파일 ID</div>
          <input id="settingsFileId" type="text" readonly placeholder="선택 후 자동 입력" />
        </div>
        <div class="row" style="gap:8px;">
          <button onclick="openPickerWithPurpose('settings')">세팅 파일 선택</button>
          <button id="load-settings-btn" class="primary" onclick="loadSettingsFromSheet()">불러오기</button>
          <button id="save-settings-btn" onclick="saveSettingsToSheet()">저장</button>
        </div>
      </div>
      <div class="toolbar">
        <button onclick="closeSettings()">닫기</button>
        <button class="primary" onclick="applySettingsFromModal()">적용</button>
      </div>
    </div>
  </div>
</body>
</html>
