spring.application.name=edge-management

# Google OAuth2/Drive 설정
# OAuth2 클라이언트 ID/Secret (웹 애플리케이션용) — 환경변수나 외부 파일로 관리 권장
google.service.account.keyPath=credentials/service-account.json

# 접근 범위 설정 (쉼표 구분)
# 기본 OAuth 스코프 (비워둬도 됨)
google.oauth.scopes=
# 드라이브 스코프 (필요 시 최소 권한으로 조정)
google.drive.scopes=https://www.googleapis.com/auth/drive.readonly
# 시트 스코프 (읽기 전용)
# 시트 쓰기 권한 필요 (settings 저장/결과 기록)
google.sheets.scopes=https://www.googleapis.com/auth/spreadsheets

# 토큰/자격증명 저장 경로 (서버 로컬 저장 예시)
google.credentials.store=credentials/edge-google

# DB 미사용으로 임시 제외 (추후 DB 설정 시 제거)
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration